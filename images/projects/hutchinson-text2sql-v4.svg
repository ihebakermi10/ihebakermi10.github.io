<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="t d">
  <title id="t">Hutchinson Text-to-SQL R1-7B v4: fine-tuning and production serving pipeline</title>
  <desc id="d">Training lane: dataset, PEFT LoRA supervised fine-tuning, evaluation and MLflow registry. Serving lane: vLLM serving, shadow deployment, A/B test against v3, canary rollout with automatic rollback, and monitored production. Below, the release gates that passed and a chart of traffic moving from v3 to v4.</desc>
  <defs>
    <radialGradient id="glowA" cx="10%" cy="0%" r="70%">
      <stop offset="0" stop-color="#E2CBA4" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#E2CBA4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="95%" cy="90%" r="60%">
      <stop offset="0" stop-color="#C9A25E" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#C9A25E" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="signal" x1="0" x2="1">
      <stop offset="0" stop-color="#E2CBA4"/>
      <stop offset="1" stop-color="#C9A25E"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#2E2922" stroke-opacity="0.45" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#C9A25E"/>
    </marker>
    <marker id="arrowClay" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#E2CBA4"/>
    </marker>
  </defs>

  <rect width="1600" height="1000" fill="#0A0908"/>
  <rect width="1600" height="1000" fill="url(#grid)"/>
  <rect width="1600" height="1000" fill="url(#glowA)"/>
  <rect width="1600" height="1000" fill="url(#glowB)"/>

  <!-- Heading -->
  <g font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif">
    <text x="90" y="100" fill="#E2CBA4" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="21" letter-spacing="4">LLM FINE-TUNING → PRODUCTION SERVING</text>
    <text x="90" y="166" fill="#F2EADB" font-size="54" font-weight="700">Hutchinson Text-to-SQL R1-7B <tspan fill="#E2CBA4">v4</tspan></text>
    <text x="90" y="210" fill="#B3A794" font-size="25">PEFT LoRA on Arctic-Text2SQL-R1-7B · BF16 · PostgreSQL + pgvector</text>
  </g>

  <!-- Lane 1: train -->
  <g font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif">
    <text x="90" y="256" fill="#B3A794" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="15" letter-spacing="3">TRAIN</text>
    <g stroke="url(#signal)" stroke-width="2.5" marker-end="url(#arrow)">
      <line x1="426" y1="318" x2="448" y2="318"/>
      <line x1="788" y1="318" x2="810" y2="318"/>
      <line x1="1150" y1="318" x2="1172" y2="318"/>
    </g>
    <g>
      <rect x="90" y="270" width="334" height="96" rx="18" fill="#141210" stroke="#2E2922" stroke-width="2"/>
      <text x="402" y="304" fill="#E2CBA4" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="17" text-anchor="end">01</text>
      <text x="114" y="310" fill="#F2EADB" font-size="25" font-weight="600">Dataset</text>
      <text x="114" y="344" fill="#B3A794" font-size="18">SQL + pgvector pairs</text>
    </g>
    <g>
      <rect x="452" y="270" width="334" height="96" rx="18" fill="#1D1A16" stroke="#E2CBA4" stroke-width="2.5"/>
      <text x="764" y="304" fill="#E2CBA4" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="17" text-anchor="end">02</text>
      <text x="476" y="310" fill="#F2EADB" font-size="25" font-weight="600">LoRA SFT</text>
      <text x="476" y="344" fill="#B3A794" font-size="18">rank 64 · α 128 · BF16</text>
    </g>
    <g>
      <rect x="814" y="270" width="334" height="96" rx="18" fill="#141210" stroke="#2E2922" stroke-width="2"/>
      <text x="1126" y="304" fill="#E2CBA4" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="17" text-anchor="end">03</text>
      <text x="838" y="310" fill="#F2EADB" font-size="25" font-weight="600">Evaluate</text>
      <text x="838" y="344" fill="#B3A794" font-size="18">SQL · dialect · pgvector checks</text>
    </g>
    <g>
      <rect x="1176" y="270" width="334" height="96" rx="18" fill="#141210" stroke="#2E2922" stroke-width="2"/>
      <text x="1488" y="304" fill="#E2CBA4" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="17" text-anchor="end">04</text>
      <text x="1200" y="310" fill="#F2EADB" font-size="25" font-weight="600">Registry</text>
      <text x="1200" y="344" fill="#B3A794" font-size="18">MLflow model version</text>
    </g>
  </g>

  <!-- Hand-off from registry to serving -->
  <path d="M1343 366 V390 Q1343 398 1335 398 H228 Q220 398 220 406 V424" fill="none" stroke="#E2CBA4" stroke-width="2.5" stroke-dasharray="8 7" marker-end="url(#arrowClay)"/>

  <!-- Lane 2: serve and roll out -->
  <g font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif">
    <text x="1510" y="420" fill="#B3A794" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="15" letter-spacing="3" text-anchor="end">SERVE &amp; ROLL OUT</text>
    <g stroke="url(#signal)" stroke-width="2.5" marker-end="url(#arrow)">
      <line x1="352" y1="484" x2="376" y2="484"/>
      <line x1="642" y1="484" x2="666" y2="484"/>
      <line x1="932" y1="484" x2="956" y2="484"/>
      <line x1="1222" y1="484" x2="1246" y2="484"/>
    </g>
    <g>
      <rect x="90" y="432" width="260" height="104" rx="18" fill="#1D1A16" stroke="#C9A25E" stroke-width="2.5"/>
      <text x="328" y="466" fill="#C9A25E" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="17" text-anchor="end">05</text>
      <text x="112" y="474" fill="#F2EADB" font-size="24" font-weight="600">vLLM serve</text>
      <text x="112" y="510" fill="#B3A794" font-size="17">OpenAI-compatible API</text>
    </g>
    <g>
      <rect x="380" y="432" width="260" height="104" rx="18" fill="#141210" stroke="#2E2922" stroke-width="2" stroke-dasharray="7 6"/>
      <text x="618" y="466" fill="#C9A25E" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="17" text-anchor="end">06</text>
      <text x="402" y="474" fill="#F2EADB" font-size="24" font-weight="600">Shadow</text>
      <text x="402" y="510" fill="#B3A794" font-size="17">mirror live traffic, diff</text>
    </g>
    <g>
      <rect x="670" y="432" width="260" height="104" rx="18" fill="#141210" stroke="#2E2922" stroke-width="2"/>
      <text x="908" y="466" fill="#C9A25E" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="17" text-anchor="end">07</text>
      <text x="692" y="474" fill="#F2EADB" font-size="24" font-weight="600">A/B test</text>
      <text x="692" y="510" fill="#B3A794" font-size="17">v4 vs v3 · SQL accuracy</text>
    </g>
    <g>
      <rect x="960" y="432" width="260" height="104" rx="18" fill="#141210" stroke="#2E2922" stroke-width="2"/>
      <text x="1198" y="466" fill="#C9A25E" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="17" text-anchor="end">08</text>
      <text x="982" y="474" fill="#F2EADB" font-size="24" font-weight="600">Canary</text>
      <text x="982" y="510" fill="#B3A794" font-size="17">ramp · auto-rollback</text>
    </g>
    <g>
      <rect x="1250" y="432" width="260" height="104" rx="18" fill="#1D1A16" stroke="#9DB89A" stroke-width="2.5"/>
      <text x="1488" y="466" fill="#9DB89A" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="17" text-anchor="end">09</text>
      <text x="1272" y="474" fill="#F2EADB" font-size="24" font-weight="600">Production</text>
      <text x="1272" y="510" fill="#B3A794" font-size="17">100% · monitored</text>
    </g>
  </g>

  <!-- Release gates -->
  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="19">
    <rect x="90" y="580" width="850" height="330" rx="24" fill="#141210" stroke="#2E2922" stroke-width="2"/>
    <text x="122" y="626" fill="#F2EADB" font-size="19">release gates</text>
    <text x="908" y="626" fill="#B3A794" font-size="15" text-anchor="end">v4 · production</text>
    <g stroke="#2E2922" stroke-width="1.5">
      <line x1="122" y1="716" x2="908" y2="716"/>
      <line x1="122" y1="776" x2="908" y2="776"/>
      <line x1="122" y1="836" x2="908" y2="836"/>
    </g>
    <text x="122" y="696" fill="#B3A794">› model <tspan fill="#F2EADB">hutchinson-text-to-sql</tspan> ready</text>
    <text x="900" y="696" fill="#9DB89A" text-anchor="end">✓</text>
    <text x="122" y="756" fill="#B3A794">› shadow diff · A/B gate · canary gate</text>
    <text x="900" y="756" fill="#9DB89A" text-anchor="end">✓</text>
    <text x="122" y="816" fill="#B3A794">› rollback armed · Prometheus alerts</text>
    <text x="900" y="816" fill="#9DB89A" text-anchor="end">✓</text>
    <text x="122" y="876" fill="#B3A794">› MLflow tracing on every request</text>
    <text x="900" y="876" fill="#9DB89A" text-anchor="end">✓</text>
  </g>

  <!-- Traffic shift chart -->
  <g font-family="ui-monospace, Menlo, Consolas, monospace">
    <rect x="970" y="580" width="540" height="330" rx="24" fill="#141210" stroke="#2E2922" stroke-width="2"/>
    <text x="1002" y="626" fill="#F2EADB" font-size="19">traffic shift</text>
    <g font-size="15">
      <rect x="1376" y="614" width="14" height="10" rx="2" fill="#E2CBA4"/>
      <text x="1396" y="624" fill="#B3A794">v4</text>
      <rect x="1434" y="614" width="14" height="10" rx="2" fill="#C9A25E" fill-opacity="0.55"/>
      <text x="1454" y="624" fill="#B3A794">v3</text>
    </g>
    <line x1="1002" y1="852" x2="1478" y2="852" stroke="#2E2922" stroke-width="1.5"/>
    <!-- shadow: v3 serves everything, v4 receives a mirrored copy -->
    <rect x="1020" y="672" width="72" height="180" rx="6" fill="#C9A25E" fill-opacity="0.55"/>
    <rect x="1024" y="676" width="64" height="172" rx="5" fill="none" stroke="#E2CBA4" stroke-width="2.5" stroke-dasharray="7 5"/>
    <!-- A/B -->
    <rect x="1140" y="708" width="72" height="144" rx="6" fill="#C9A25E" fill-opacity="0.55"/>
    <rect x="1140" y="672" width="72" height="34" rx="6" fill="#E2CBA4"/>
    <!-- canary -->
    <rect x="1260" y="780" width="72" height="72" rx="6" fill="#C9A25E" fill-opacity="0.55"/>
    <rect x="1260" y="672" width="72" height="106" rx="6" fill="#E2CBA4"/>
    <!-- production -->
    <rect x="1380" y="672" width="72" height="180" rx="6" fill="#E2CBA4"/>
    <g fill="#B3A794" font-size="15" text-anchor="middle">
      <text x="1056" y="882">shadow</text>
      <text x="1176" y="882">A/B</text>
      <text x="1296" y="882">canary</text>
      <text x="1416" y="882">prod</text>
    </g>
  </g>
</svg>
